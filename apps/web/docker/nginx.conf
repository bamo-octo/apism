server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # La configuration d'execution ne doit jamais etre mise en cache :
    # elle change a chaque etape du TP.
    location = /configuration.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Les fichiers produits par Angular portent une empreinte dans leur nom.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routage cote client : toute autre URL renvoie l'application.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
