#   Navigateur ──> SPA MyBrew (nginx, :4200) ──> API MyBrew (NestJS, :3000)
#   Navigateur ──> Keycloak (:18080) pour la connexion des utilisateurs
#   Fournisseur ──> Keycloak (:18080) puis API MyBrew, avec un jeton d'accès
#   Ascenseur ──> Keycloak (:18080) puis API MyBrew, pour le compte d'un utilisateur
#   API MyBrew ──> Catalogue (:3001, joignable uniquement sur le réseau Docker)
#   Navigateur ──> Gateway Gravitee (:8082) ──> API MyBrew
#   Navigateur ──> Console Gravitee (:8084) ──> API de management Gravitee (:8083)
#   Gateway Gravitee ──> Elasticsearch (métriques des requêtes) <── API de management Gravitee

name: mybrew

networks:
  mybrew:
    name: mybrew

volumes:
  donnees-mongo:
  donnees-elasticsearch:

services:
  keycloak:
    image: keycloak/keycloak:26.7
    container_name: mybrew-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      # URL de Keycloak vue depuis l'extérieur : c'est l'émetteur (`iss`) inscrit dans les jetons.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:18080}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      # Repris de l'environnement s'il est défini (ex : xforwarded derrière un reverse-proxy).
      KC_PROXY_HEADERS:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Adresse de la SPA dans le navigateur, autorisée comme redirection du client `mybrew-web`.
      ORIGINE_SPA: ${ORIGINE_SPA:-http://localhost:4200}
    # Sans volume, le realm est réimporté à chaque recréation du conteneur.
    volumes:
      - ./infra/keycloak/realm-mybrew.json:/opt/keycloak/data/import/realm-mybrew.json:ro
    ports:
      - '18080:8080'
    networks:
      - mybrew

  api:
    build:
      context: ./apps/api
    image: mybrew/api:formation
    container_name: mybrew-api
    environment:
      PORT: '3000'
      # Une clé par front autorisé, séparées par des virgules.
      CLES_API: 'cle-mybrew-web-b4b213eacc3e876c,cle-front-employes-6b8ca27f2f4caada,cle-ascenseur-17c912ea672e5b69'
      # L'émetteur attendu est l'URL publique ; les clés publiques sont téléchargées via le réseau Docker.
      KEYCLOAK_URL_PUBLIQUE: ${KEYCLOAK_URL_PUBLIQUE:-http://localhost:18080}
      KEYCLOAK_URL_INTERNE: http://keycloak:8080
      CATALOGUE_URL: http://catalogue:3001
      # Jeton envoyé au catalogue : vide (aucun), `transmettre` (le jeton reçu) ou `echanger` (token exchange).
      CATALOGUE_JETON: 'echanger'
      # Secret du client `mybrew-api`, nécessaire pour échanger un jeton.
      KEYCLOAK_CLIENT_SECRET: 'secret-mybrew-api-3f6b1c9e27d4a805'
    ports:
      - '3000:3000'
    networks:
      - mybrew
    depends_on:
      - catalogue

  catalogue:
    build:
      context: ./apps/catalogue
    image: mybrew/catalogue:formation
    container_name: mybrew-catalogue
    environment:
      PORT: '3001'
      # À 'true', le catalogue exige un jeton d'accès dont l'audience est `catalogue`.
      CATALOGUE_JETON_OBLIGATOIRE: 'true'
      KEYCLOAK_URL_PUBLIQUE: ${KEYCLOAK_URL_PUBLIQUE:-http://localhost:18080}
      KEYCLOAK_URL_INTERNE: http://keycloak:8080
    networks:
      - mybrew

  web:
    build:
      context: ./apps/web
    image: mybrew/web:formation
    container_name: mybrew-web
    environment:
      WEB_URL_API: ${API_URL_GATEWAY:-http://localhost:8082/mybrew}
      WEB_KEYCLOAK_AUTORITE: ${KEYCLOAK_URL_PUBLIQUE:-http://localhost:18080}/realms/mybrew
    ports:
      - '4200:80'
    networks:
      - mybrew
    depends_on:
      - api

  # Interface de l'ascenseur, lancée à la demande avec `make ascenseur`.
  ascenseur:
    image: node:24-alpine
    profiles:
      - outils
    working_dir: /ascenseur
    command: node ascenseur.mjs
    volumes:
      - ./apps/ascenseur:/ascenseur:ro
    environment:
      ASCENSEUR_URL_API: http://api:3000
      ASCENSEUR_CLE_API: cle-ascenseur-17c912ea672e5b69
      ASCENSEUR_KEYCLOAK_AUTORITE: http://keycloak:8080/realms/mybrew
      # Vide : l'ascenseur commande sans identifier l'utilisateur.
      ASCENSEUR_CLIENT_ID: 'ascenseur'
    networks:
      - mybrew
    depends_on:
      - api

  # Stockage de la configuration de Gravitee (API, plans, applications).
  mongodb:
    image: mongo:7
    container_name: mybrew-mongodb
    volumes:
      - donnees-mongo:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q 1']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mybrew

  # Stockage des métriques de la gateway, lues par la console Gravitee.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: mybrew-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - donnees-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"']
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - mybrew

  gateway:
    image: graviteeio/apim-gateway:4.12.19
    container_name: mybrew-gateway
    environment:
      gravitee_management_mongodb_uri: mongodb://mongodb:27017/gravitee
      gravitee_ratelimit_mongodb_uri: mongodb://mongodb:27017/gravitee
      # À 'true', la gateway envoie à Elasticsearch une métrique par requête.
      gravitee_reporters_elasticsearch_enabled: 'false'
      gravitee_reporters_elasticsearch_endpoints_0: http://elasticsearch:9200
      # Les API déployées depuis la console sont prises en compte en 2 secondes.
      gravitee_services_sync_delay: '2000'
    ports:
      - '8082:8082'
    networks:
      - mybrew
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  management-api:
    image: graviteeio/apim-management-api:4.12.19
    container_name: mybrew-management-api
    environment:
      gravitee_management_mongodb_uri: mongodb://mongodb:27017/gravitee
      gravitee_analytics_elasticsearch_endpoints_0: http://elasticsearch:9200
      gravitee_console_url: ${GRAVITEE_CONSOLE_URL:-http://localhost:8084}
    ports:
      - '8083:8083'
    networks:
      - mybrew
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  console:
    image: graviteeio/apim-management-ui:4.12.19
    container_name: mybrew-console
    environment:
      MGMT_API_URL: ${MGMT_API_URL:-http://localhost:8083/management/}
    ports:
      - '8084:8080'
    networks:
      - mybrew
    depends_on:
      - management-api

  # Importe l'API MyBrew dans Gravitee au premier démarrage, puis s'arrête.
  gravitee-import:
    image: node:24-alpine
    container_name: mybrew-gravitee-import
    working_dir: /gravitee
    command: node importer.mjs
    volumes:
      - ./infra/gravitee:/gravitee:ro
    environment:
      URL_MANAGEMENT_API: http://management-api:8083
      # Adresse de la SPA dans le navigateur, autorisée par le CORS de la gateway.
      ORIGINE_SPA: ${ORIGINE_SPA:-http://localhost:4200}
    networks:
      - mybrew
    depends_on:
      - management-api
    restart: 'no'
