#   Navigateur ──> SPA MyBrew (nginx, :4200) ──> API MyBrew (NestJS, :3000)
#   Navigateur ──> Keycloak (:18080) pour la connexion des utilisateurs
#   Fournisseur ──> Keycloak (:18080) puis API MyBrew, avec un jeton d'accès

name: mybrew

networks:
  mybrew:
    name: mybrew

services:
  keycloak:
    image: keycloak/keycloak:26.7
    container_name: mybrew-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      # URL de Keycloak vue depuis l'extérieur : c'est l'émetteur (`iss`) inscrit dans les jetons.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:18080}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      # Repris de l'environnement s'il est défini (ex : xforwarded derrière un reverse-proxy).
      KC_PROXY_HEADERS:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Adresse de la SPA dans le navigateur, autorisée comme redirection du client `mybrew-web`.
      ORIGINE_SPA: ${ORIGINE_SPA:-http://localhost:4200}
    # Sans volume, le realm est réimporté à chaque recréation du conteneur.
    volumes:
      - ./infra/keycloak/realm-mybrew.json:/opt/keycloak/data/import/realm-mybrew.json:ro
    ports:
      - '18080:8080'
    networks:
      - mybrew

  api:
    build:
      context: ./apps/api
    image: mybrew/api:formation
    container_name: mybrew-api
    environment:
      PORT: '3000'
      # Une clé par front autorisé, séparées par des virgules.
      CLES_API: 'cle-mybrew-web-b4b213eacc3e876c,cle-front-employes-6b8ca27f2f4caada'
      # L'émetteur attendu est l'URL publique ; les clés publiques sont téléchargées via le réseau Docker.
      KEYCLOAK_URL_PUBLIQUE: ${KEYCLOAK_URL_PUBLIQUE:-http://localhost:18080}
      KEYCLOAK_URL_INTERNE: http://keycloak:8080
    ports:
      - '3000:3000'
    networks:
      - mybrew

  web:
    build:
      context: ./apps/web
    image: mybrew/web:formation
    container_name: mybrew-web
    environment:
      WEB_URL_API: ${API_URL_DIRECTE:-http://localhost:3000}
      WEB_KEYCLOAK_AUTORITE: ${KEYCLOAK_URL_PUBLIQUE:-http://localhost:18080}/realms/mybrew
    ports:
      - '4200:80'
    networks:
      - mybrew
    depends_on:
      - api
